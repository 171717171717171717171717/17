<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>17</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000;
      color: #fff;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }


    .number {
      font-size: 110px;
      font-weight: 400;
      letter-spacing: -8px;
      user-select: none;
    }


    .corrupted {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);

      font-size: 7px;
      color: #444;
      letter-spacing: 1px;
      white-space: nowrap;
      user-select: none;
    }

 
    .code-area {
      position: absolute;
      left: 18px;
      bottom: 18px;
    }

    .code-input {
      width: 170px;
      height: 25px;

      background: transparent;
      border: 1px solid #222;

      color: #888;
      outline: none;

      padding: 4px 7px;

      font-family: monospace;
      font-size: 10px;
    }

    .code-input:focus {
      border-color: #444;
    }


    .location {
      position: absolute;

      top: calc(50% + 75px);
      left: 50%;

      transform: translateX(-50%);

      display: none;

      color: #666;
      font-family: monospace;
      font-size: 11px;

      white-space: nowrap;
      user-select: text;
    }

    .location.visible {
      display: block;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="number">
      17
    </div>

    <div
      class="location"
      id="location"
    >
      71.96351016684365, 102.4302505344339
    </div>

    <div class="corrupted">
      my source code is corrupted
    </div>

    <div class="code-area">
      <input
        id="code"
        class="code-input"
        type="text"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
      >
    </div>

  </div>

  <script>
    const input = document.getElementById("code");
    const location = document.getElementById("location");


    const fragments = [
      [87, 72, 89],

      [
        49, 55, 49, 55, 49,
        55, 49, 55, 49, 55, 49
      ],

      [87, 72, 89]
    ];

    const secret = fragments
      .flat()
      .map(value => String.fromCharCode(value))
      .join("");


    input.addEventListener("input", () => {

      const value = input.value;



      if (value.length !== secret.length) {
        location.classList.remove("visible");
        return;
      }

      let valid = true;



      for (let i = 0; i < secret.length; i++) {

        if (
          value.charCodeAt(i) !==
          secret.charCodeAt(i)
        ) {
          valid = false;
          break;
        }

      }

      location.classList.toggle(
        "visible",
        valid
      );

    });
  </script>

</body>
</html>
