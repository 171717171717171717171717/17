
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>17</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    .screen {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .number {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 110px;
      font-weight: 300;
      letter-spacing: -9px;
      user-select: none;
    }

    .corrupted {
      position: absolute;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      color: #3b3b3b;
      font-size: 7px;
      letter-spacing: 1.5px;
      white-space: nowrap;
      user-select: none;
    }

    .input-container {
      position: absolute;
      left: 18px;
      bottom: 18px;
    }

    #answer {
      width: 150px;
      height: 25px;
      padding: 4px 7px;
      background: transparent;
      border: 1px solid #191919;
      outline: none;
      color: #777;
      font-family: monospace;
      font-size: 10px;
      transition: border-color 0.3s ease;
    }

    #answer:focus {
      border-color: #333;
    }

    #location {
      position: absolute;
      top: calc(50% + 78px);
      left: 50%;
      transform: translateX(-50%);
      display: none;
      color: #555;
      font-family: monospace;
      font-size: 10px;
      letter-spacing: 0.5px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 1.5s ease;
    }

    #location.visible {
      display: block;
      opacity: 1;
    }
  </style>
</head>

<body>

  <main class="screen">
    <div class="number">17</div>

    <div id="location"></div>

    <div class="corrupted">
      my source code is corrupted
    </div>

    <div class="input-container">
      <input
        id="answer"
        type="text"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        aria-label="Answer"
      >
    </div>
  </main>

  <script>
    const input = document.getElementById("answer");
    const locationElement = document.getElementById("location");

    const sequence = [1, 1];

    for (let i = 2; i < 12; i++) {
      sequence[i] = sequence[i - 1] + sequence[i - 2];
    }

    const seventh = sequence[6];

    const fragments = [3, 17, 7, 71];

    const a = fragments[2];
    const b = fragments[0];
    const c = fragments[3];
    const d = fragments[1];

    const answer =
      Math.pow(c - a, 2) * d + seventh;

    const vault = {
      x: [
        719635,
        1016684365
      ],
      y: [
        102430,
        2505344339
      ]
    };

    function recoverLocation() {
      const latitude =
        Number(
          BigInt(vault.x[0]) * 10000000000n +
          BigInt(vault.x[1])
        ) / 100000000000000;

      const longitude =
        Number(
          BigInt(vault.y[0]) * 10000000000n +
          BigInt(vault.y[1])
        ) / 10000000000000;

      return latitude + ", " + longitude;
    }

    input.addEventListener("input", () => {
      const value = input.value.trim();

      if (!/^\d+$/.test(value)) {
        locationElement.classList.remove("visible");
        return;
      }

      const entered = Number(value);

      if (entered === answer) {
        locationElement.textContent = recoverLocation();
        locationElement.classList.add("visible");
      } else {
        locationElement.classList.remove("visible");
      }
    });
  </script>

</body>
</html>
